name: CoreLabTech QA

on:
  push:
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: corelabtech
          POSTGRES_PASSWORD: corelabtech
          POSTGRES_DB: corelabtech_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U corelabtech -d corelabtech_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node dependencies
        run: |
          npm install
          npm install --save-dev @playwright/test

      - name: Install Playwright browsers
        run: |
          npx playwright install --with-deps chromium

      - name: Initialize E2E database
        env:
          DATABASE_URL: "postgresql://corelabtech:corelabtech@127.0.0.1:5432/corelabtech_test"
          E2E_ADMIN_PASSWORD: "Admin123!"
          E2E_RESEARCHER_PASSWORD: "Researcher123!"
        run: |
          python run_database_setup.py
          python seed_postgres_db.py

      - name: Start Flask for E2E
        env:
          FLASK_ENV: production
          APP_ENV: test
          SECRET_KEY: e2e-secret
          SESSION_COOKIE_SECURE: "False"
          DATABASE_URL: "postgresql://corelabtech:corelabtech@127.0.0.1:5432/corelabtech_test"
        run: |
          python app.py > flask-e2e.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/login > /dev/null; then
              echo "Flask is ready for Playwright"
              exit 0
            fi
            sleep 1
          done
          cat flask-e2e.log
          exit 1

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_BASE_URL: "http://127.0.0.1:5000"
          E2E_ADMIN_EMAIL: "admin@corelabtech.local"
          E2E_ADMIN_PASSWORD: "Admin123!"
        run: |
          npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload Flask E2E log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flask-e2e-log
          path: flask-e2e.log

  performance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Flask
        env:
          FLASK_ENV: production
          APP_ENV: production
          PERFORMANCE_TESTING: "true"
          SESSION_COOKIE_SECURE: "False"
          DATABASE_URL: sqlite:///ci_test.db
        run: |
          python app.py > flask-performance.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/api/performance/sessions > /dev/null; then
              echo "Flask is ready for performance tests"
              exit 0
            fi
            sleep 1
          done
          cat flask-performance.log
          exit 1

      - name: Run Gatling performance tests
        working-directory: tests/performance/gatling
        run: |
          mvn gatling:test -Dgatling.simulationClass=corelabtech.SessionsSimulation
          mvn gatling:test -Dgatling.simulationClass=corelabtech.RunAnalysisSimulation

      - name: Upload Gatling reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatling-report
          path: tests/performance/gatling/target/gatling/

      - name: Upload Flask performance log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flask-performance-log
          path: flask-performance.log
